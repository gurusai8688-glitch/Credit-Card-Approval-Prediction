<!DOCTYPE html>
<html>

<head>
    <title>Credit Card Approval Prediction</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class = "container">
        <h2>Credit Card Approval Prediction</h2>

    <form action="/predict" method="POST">

        <label>ID</label><br>
        <input type="number" name="f1" placeholder="Enter ID"><br><br>

        <label>Gender</label><br>
        <select name="f2">
            <option value="1">Male</option>
            <option value="0">Female</option>
        </select><br><br>

        <label>Own Car</label><br>
        <select name="f3">
            <option value="1">Yes</option>
            <option value="0">No</option>
        </select><br><br>

        <label>Own House</label><br>
        <select name="f4">
            <option value="1">Yes</option>
            <option value="0">No</option>
        </select><br><br>

        <label>Number of Children</label><br>
        <input type="number" name="f5" placeholder="0"><br><br>

        <label>Annual Income</label><br>
        <input type="number" name="f6" placeholder="112500"><br><br>
        <label>Occupation</label><br>

<select name="f7">
    <option value="0">Laborers</option>
    <option value="1">Core Staff</option>
    <option value="2">Managers</option>
    <option value="3">Drivers</option>
    <option value="4">Sales Staff</option>
    <option value="5">Medicine Staff</option>
    <option value="6">Security Staff</option>
    <option value="7">Accountants</option>
    <option value="8">High Skill Tech Staff</option>
</select><br><br>

<label>Education Type</label><br>
<select name="f8">
    <option value="0">Secondary / Secondary Special</option>
    <option value="1">Higher Education</option>
    <option value="2">Incomplete Higher</option>
    <option value="3">Lower Secondary</option>
    <option value="4">Academic Degree</option>
</select><br><br>

<label>Family Status</label><br>
<select name="f9">
    <option value="0">Single</option>
    <option value="1">Married</option>
    <option value="2">Civil Marriage</option>
    <option value="3">Separated</option>
    <option value="4">Widow</option>
</select><br><br>

<label>Housing Type</label><br>

<select name="f10">
    <option value="0">House / Apartment</option>
    <option value="1">With Parents</option>
    <option value="2">Municipal Apartment</option>
    <option value="3">Rented Apartment</option>
    <option value="4">Office Apartment</option>
    <option value="5">Co-op Apartment</option>
</select><br><br>

        <label>Days Birth</label><br>
        <input type="number" name="f11"><br><br>

        <label>Days Employed</label><br>
        <input type="number" name="f12"><br><br>

        <label>Mobile Available</label><br>
        <select name="f13">
            <option value="1">Yes</option>
            <option value="0">No</option>
        </select><br><br>

        <label>Work Phone</label><br>
        <select name="f14">
            <option value="1">Yes</option>
            <option value="0">No</option>
        </select><br><br>

        <label>Phone</label><br>
        <select name="f15">
            <option value="1">Yes</option>
            <option value="0">No</option>
        </select><br><br>

        <label>Email</label><br>
        <select name="f16">
            <option value="1">Yes</option>
            <option value="0">No</option>
        </select><br><br>
        
        <label>Occupation Type</label><br>
<select name="f17">
    <option value="0">Laborers</option>
    <option value="1">Core Staff</option>
    <option value="2">Managers</option>
    <option value="3">Drivers</option>
    <option value="4">Sales Staff</option>
    <option value="5">Medicine Staff</option>
    <option value="6">Security Staff</option>
    <option value="7">Accountants</option>
    <option value="8">High Skill Tech Staff</option>
</select><br><br>


        <label>Family Members</label><br>
        <input type="number" name="f18"><br><br>

        <input type="submit" value="Predict">

    </form>

    <h3>{{ prediction_text }}</h3>
    </div>
</body>

</html>
